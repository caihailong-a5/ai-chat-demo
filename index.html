<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 对话 Demo</title>
<style>
/* ============ 主题变量：改这里就能整体换肤 ============ */
:root {
  --bg: #FAFAF8;
  --panel: #FFFFFF;
  --sub: #F1EFE8;
  --text: #2C2C2A;
  --muted: #6E6D67;
  --border: #E5E3DC;
  --accent: #534AB7;
  --accent-soft: #EEEDFE;
  --user-bg: #EEEDFE;
  --ai-bg: #FFFFFF;
  --danger: #A32D2D;
  --danger-bg: #FCEBEB;
  --code-bg: #F5F4F0;
}
[data-theme="dark"] {
  --bg: #1B1B19;
  --panel: #242422;
  --sub: #2E2E2B;
  --text: #EDEDEA;
  --muted: #9C9C95;
  --border: #383834;
  --accent: #AFA9EC;
  --accent-soft: #2E2A52;
  --user-bg: #2E2A52;
  --ai-bg: #242422;
  --danger: #F09595;
  --danger-bg: #3A2424;
  --code-bg: #1A1A18;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  height: 100vh; display: flex; flex-direction: column;
  transition: background .2s, color .2s;
}

/* ============ 顶栏 ============ */
header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 20px; background: var(--panel);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.logo {
  width: 26px; height: 26px; border-radius: 7px; background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 13px; font-weight: 500; flex-shrink: 0;
}
header h1 { font-size: 15px; font-weight: 500; }
.spacer { flex: 1; }
.badge {
  font-size: 12px; padding: 3px 10px; border-radius: 20px;
  background: var(--accent-soft); color: var(--accent); white-space: nowrap;
}
.badge.warn { background: var(--sub); color: var(--muted); }
.iconbtn {
  width: 32px; height: 32px; padding: 0; font-size: 15px;
  border: 1px solid var(--border); background: transparent; color: var(--muted);
  border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.iconbtn:hover { background: var(--sub); color: var(--text); }

/* ============ 设置面板 ============ */
#panel {
  display: none; padding: 14px 20px; background: var(--panel);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
#panel.open { display: block; }
.prow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.prow:last-child { margin-bottom: 0; }
.prow label { font-size: 12px; color: var(--muted); min-width: 52px; }
input[type=text], select, textarea, #input {
  font-family: inherit; font-size: 13px; padding: 7px 10px; color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; background: var(--panel); outline: none;
}
input[type=text]:focus, select:focus, textarea:focus, #input:focus { border-color: var(--accent); }
#keyInput { width: 260px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
#codeInput { width: 200px; }
#sysInput { flex: 1; min-width: 220px; resize: none; height: 34px; }
.btn {
  font-family: inherit; font-size: 13px; padding: 7px 14px; cursor: pointer;
  border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--text);
}
.btn:hover { background: var(--sub); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { opacity: .88; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ============ 聊天区 ============ */
#chat { flex: 1; overflow-y: auto; padding: 24px 20px; }
.wrap { max-width: 780px; margin: 0 auto; }

#welcome { text-align: center; padding: 60px 20px; color: var(--muted); }
#welcome h2 { font-size: 19px; font-weight: 500; color: var(--text); margin-bottom: 8px; }
#welcome p { font-size: 13px; margin-bottom: 24px; }
.examples { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; max-width: 560px; margin: 0 auto; }
.example {
  text-align: left; padding: 12px 14px; font-size: 13px; line-height: 1.5;
  border: 1px solid var(--border); border-radius: 10px; background: var(--panel);
  color: var(--text); cursor: pointer; font-family: inherit;
}
.example:hover { border-color: var(--accent); background: var(--accent-soft); }

.msg { display: flex; gap: 10px; margin-bottom: 22px; }
.avatar {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 500; color: #fff;
}
.user .avatar { background: var(--accent); }
.assistant .avatar { background: #1D9E75; }
.body { flex: 1; min-width: 0; }
.who { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.bubble {
  font-size: 14px; line-height: 1.7; word-break: break-word;
  padding: 12px 16px; border-radius: 12px; background: var(--ai-bg);
  border: 1px solid var(--border);
}
.user .bubble { background: var(--user-bg); border-color: transparent; }
.bubble.typing::after {
  content: ''; display: inline-block; width: 2px; height: 1em;
  background: var(--accent); margin-left: 3px; vertical-align: text-bottom;
  animation: blink 1s steps(2, start) infinite;
}
@keyframes blink { to { visibility: hidden; } }
.bubble.err { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); font-size: 13px; white-space: pre-wrap; }

/* 思考过程（reasoner 模型） */
.think { margin-bottom: 8px; font-size: 13px; }
.think summary {
  cursor: pointer; color: var(--muted); font-size: 12px;
  padding: 4px 0; user-select: none;
}
.think .tcontent {
  color: var(--muted); border-left: 2px solid var(--border);
  padding: 6px 0 6px 12px; white-space: pre-wrap; line-height: 1.6;
}

/* Markdown 渲染 */
.bubble p { margin: 0 0 10px; }
.bubble p:last-child { margin-bottom: 0; }
.bubble h1, .bubble h2, .bubble h3 { font-size: 15px; font-weight: 500; margin: 14px 0 8px; }
.bubble h1 { font-size: 17px; }
.bubble ul, .bubble ol { margin: 0 0 10px; padding-left: 22px; }
.bubble li { margin-bottom: 4px; }
.bubble blockquote {
  border-left: 3px solid var(--border); color: var(--muted);
  padding-left: 12px; margin: 0 0 10px;
}
.bubble hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
.bubble a { color: var(--accent); }
.bubble code {
  font-family: ui-monospace, Consolas, monospace; font-size: 12.5px;
  background: var(--code-bg); padding: 2px 5px; border-radius: 4px;
}
.codeblock { margin: 10px 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.codehead {
  display: flex; justify-content: space-between; align-items: center;
  padding: 5px 12px; background: var(--sub); font-size: 11px; color: var(--muted);
}
.codehead button {
  font-family: inherit; font-size: 11px; padding: 2px 9px; cursor: pointer;
  border: 1px solid var(--border); border-radius: 5px; background: var(--panel); color: var(--muted);
}
.codehead button:hover { color: var(--text); }
.codeblock pre { overflow-x: auto; padding: 12px; background: var(--code-bg); }
.codeblock code { background: none; padding: 0; font-size: 12.5px; line-height: 1.6; }

/* ============ 输入区 ============ */
#composer { padding: 12px 20px 16px; background: var(--panel); border-top: 1px solid var(--border); flex-shrink: 0; }
.composer-inner { max-width: 780px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
#input { flex: 1; resize: none; height: 44px; max-height: 180px; padding: 11px 14px; border-radius: 12px; }
.hint { max-width: 780px; margin: 6px auto 0; font-size: 11px; color: var(--muted); text-align: center; }

@media (max-width: 600px) {
  header { padding: 10px 14px; }
  #chat { padding: 16px 12px; }
  #composer { padding: 10px 12px 14px; }
  #keyInput, #codeInput { width: 100%; }
  .badge { display: none; }
}
</style>
</head>
<body>

<header>
  <div class="logo">AI</div>
  <h1>AI 对话 Demo</h1>
  <span id="mode" class="badge">检测中</span>
  <span class="spacer"></span>
  <button class="iconbtn" id="panelBtn" title="设置">设置</button>
  <button class="iconbtn" id="themeBtn" title="切换主题">主题</button>
</header>

<div id="panel">
  <div class="prow" id="keyRow">
    <label>API Key</label>
    <input type="text" id="keyInput" placeholder="sk-...（只存在你自己的浏览器）">
  </div>
  <div class="prow" id="codeRow" style="display:none">
    <label>访问口令</label>
    <input type="text" id="codeInput" placeholder="服务端开启防护时必填">
  </div>
  <div class="prow">
    <label>模型</label>
    <select id="modelSel">
      <option value="deepseek-chat">deepseek-chat（通用对话）</option>
      <option value="deepseek-reasoner">deepseek-reasoner（带思考过程）</option>
    </select>
    <button class="btn" id="clearBtn">清空对话</button>
  </div>
  <div class="prow">
    <label>系统设定</label>
    <input type="text" id="sysInput" placeholder="可选。如：你是一位严格的技术面试官">
  </div>
</div>

<div id="chat">
  <div class="wrap">
    <div id="welcome">
      <h2>有什么可以帮你的？</h2>
      <p>基于 DeepSeek 接口构建 · 流式输出 · 支持代码与 Markdown</p>
      <div class="examples">
        <button class="example">用一句话解释什么是 API</button>
        <button class="example">帮我写一段 JS 防抖函数，带注释</button>
        <button class="example">前端如何避免 API Key 泄露？</button>
        <button class="example">把「我很擅长使用 AI 工具」改写成简历表述</button>
      </div>
    </div>
    <div id="msgs"></div>
  </div>
</div>

<div id="composer">
  <div class="composer-inner">
    <textarea id="input" placeholder="输入消息，Ctrl + Enter 发送"></textarea>
    <button class="btn primary" id="sendBtn">发送</button>
  </div>
  <p class="hint">内容由 AI 生成，请注意甄别</p>
</div>

<script>
// ============================================================
//  配置与状态
// ============================================================
const REMOTE_API = 'https://api.deepseek.com/chat/completions';
const PROXY_API  = '/api/chat';

let useProxy = false;
let messages = [];
let busy = false;
let controller = null;

const $ = id => document.getElementById(id);
const chatEl = $('chat'), msgsEl = $('msgs'), welcomeEl = $('welcome');
const inputEl = $('input'), sendBtn = $('sendBtn');
const keyInput = $('keyInput'), codeInput = $('codeInput'), sysInput = $('sysInput');
const keyRow = $('keyRow'), codeRow = $('codeRow'), modelSel = $('modelSel');
const modeEl = $('mode'), panelEl = $('panel');

// ============================================================
//  主题
// ============================================================
const savedTheme = localStorage.getItem('theme') || 'light';
document.documentElement.dataset.theme = savedTheme;
$('themeBtn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('theme', next);
};

$('panelBtn').onclick = () => panelEl.classList.toggle('open');

// ============================================================
//  启动：探测本地代理，决定用不用填 Key / 口令
// ============================================================
(async function init() {
  try {
    const r = await fetch('/api/health');
    if (!r.ok) throw 0;
    const h = await r.json();
    useProxy = true;
    keyRow.style.display = 'none';
    modeEl.textContent = '代理模式 · Key 在服务端';
    if (h.needCode) {
      codeRow.style.display = 'flex';
      codeInput.value = localStorage.getItem('access_code') || '';
      codeInput.addEventListener('change', () => {
        if (codeInput.value.trim()) localStorage.setItem('access_code', codeInput.value.trim());
      });
    }
  } catch (e) {
    useProxy = false;
    modeEl.textContent = '直连模式 · Key 在本地';
    modeEl.className = 'badge warn';
    keyInput.value = localStorage.getItem('ds_key') || '';
  }
  inputEl.focus();
})();

keyInput.addEventListener('change', () => {
  if (keyInput.value.trim()) localStorage.setItem('ds_key', keyInput.value.trim());
});

// ============================================================
//  Markdown 渲染（先转义再解析，避免 AI 返回内容里的 XSS）
// ============================================================
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function inlineMd(s) {
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}
function renderMd(text) {
  const lines = escapeHtml(text).split('\n');
  let out = '', para = [], listType = null;
  let inCode = false, codeLang = '', codeBuf = [];

  const flushPara = () => {
    if (para.length) { out += '<p>' + para.map(inlineMd).join('<br>') + '</p>'; para = []; }
  };
  const closeList = () => {
    if (listType) { out += '</' + listType + '>'; listType = null; }
  };
  const flushBlock = () => { flushPara(); closeList(); };

  for (const line of lines) {
    if (line.trim().startsWith('```')) {
      if (!inCode) {
        flushBlock();
        inCode = true; codeLang = line.trim().slice(3).trim(); codeBuf = [];
      } else {
        out += '<div class="codeblock"><div class="codehead"><span>'
             + (codeLang || 'code')
             + '</span><button type="button" class="copybtn">复制</button></div>'
             + '<pre><code>' + codeBuf.join('\n') + '</code></pre></div>';
        inCode = false;
      }
      continue;
    }
    if (inCode) { codeBuf.push(line); continue; }

    const t = line.trim();
    if (!t) { flushBlock(); continue; }

    let m;
    if (m = t.match(/^(#{1,6})\s+(.*)$/)) {
      flushBlock();
      const lv = Math.min(m[1].length, 3);
      out += '<h' + lv + '>' + inlineMd(m[2]) + '</h' + lv + '>';
    } else if (m = t.match(/^[-*+]\s+(.*)$/)) {
      flushPara();
      if (listType !== 'ul') { closeList(); out += '<ul>'; listType = 'ul'; }
      out += '<li>' + inlineMd(m[1]) + '</li>';
    } else if (m = t.match(/^\d+[.)]\s+(.*)$/)) {
      flushPara();
      if (listType !== 'ol') { closeList(); out += '<ol>'; listType = 'ol'; }
      out += '<li>' + inlineMd(m[1]) + '</li>';
    } else if (m = t.match(/^&gt;\s?(.*)$/)) {
      flushBlock();
      out += '<blockquote>' + inlineMd(m[1]) + '</blockquote>';
    } else if (/^(-{3,}|\*{3,})$/.test(t)) {
      flushBlock();
      out += '<hr>';
    } else {
      closeList();
      para.push(t);
    }
  }
  // 收尾：流式输出到一半时代码块可能还没闭合，照样渲染出来
  if (inCode) {
    out += '<div class="codeblock"><div class="codehead"><span>' + (codeLang || 'code')
         + '</span><button type="button" class="copybtn">复制</button></div>'
         + '<pre><code>' + codeBuf.join('\n') + '</code></pre></div>';
  }
  flushBlock();
  return out;
}

// 代码块复制：事件委托，避免逐个绑定
chatEl.addEventListener('click', async e => {
  if (!e.target.classList.contains('copybtn')) return;
  const code = e.target.closest('.codeblock').querySelector('code').textContent;
  try {
    await navigator.clipboard.writeText(code);
    e.target.textContent = '已复制';
  } catch (err) {
    e.target.textContent = '复制失败';
  }
  setTimeout(() => { e.target.textContent = '复制'; }, 1500);
});

// ============================================================
//  消息渲染
// ============================================================
function nearBottom() {
  return chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 120;
}
function scrollBottom(force) {
  if (force || nearBottom()) chatEl.scrollTop = chatEl.scrollHeight;
}

function addMsg(role) {
  welcomeEl.style.display = 'none';
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const isUser = role === 'user';
  wrap.innerHTML =
    '<div class="avatar">' + (isUser ? '我' : 'AI') + '</div>' +
    '<div class="body">' +
      '<div class="who">' + (isUser ? '你' : 'DeepSeek · ' + modelSel.value) + '</div>' +
      (isUser ? '' : '<details class="think" style="display:none"><summary>思考过程</summary><div class="tcontent"></div></details>') +
      '<div class="bubble"></div>' +
    '</div>';
  msgsEl.appendChild(wrap);
  scrollBottom(true);
  return {
    bubble: wrap.querySelector('.bubble'),
    think: wrap.querySelector('.think'),
    thinkBody: wrap.querySelector('.tcontent')
  };
}

// ============================================================
//  主流程
// ============================================================
async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;

  const key = keyInput.value.trim();
  if (!useProxy && !key) {
    alert('请先填写 API Key（右上角「设置」）');
    panelEl.classList.add('open');
    keyInput.focus();
    return;
  }

  busy = true;
  controller = new AbortController();
  updateBtn();

  inputEl.value = '';
  inputEl.style.height = '44px';

  messages.push({ role: 'user', content: text });
  addMsg('user').bubble.textContent = text;

  const { bubble, think, thinkBody } = addMsg('assistant');
  bubble.classList.add('typing');
  bubble.textContent = '...';

  let reply = '', reasoning = '';

  try {
    const payload = [];
    const sys = sysInput.value.trim();
    if (sys) payload.push({ role: 'system', content: sys });
    payload.push(...messages);

    const res = await fetch(useProxy ? PROXY_API : REMOTE_API, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(useProxy ? {} : { 'Authorization': 'Bearer ' + key }),
        ...(codeInput.value.trim() ? { 'x-access-code': codeInput.value.trim() } : {})
      },
      body: JSON.stringify({ model: modelSel.value, messages: payload, stream: true }),
      signal: controller.signal
    });

    // 口令失效时清掉本地缓存，免得一直 401 卡住
    if (res.status === 401) {
      localStorage.removeItem('access_code');
      codeInput.value = '';
      panelEl.classList.add('open');
      throw new Error('访问口令不正确或已失效，已清空，请重新填写');
    }
    if (!res.ok) {
      const t = await res.text();
      throw new Error('HTTP ' + res.status + '\n' + t.slice(0, 300));
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '', started = false;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        const s = line.trim();
        if (!s.startsWith('data:')) continue;
        const payload2 = s.slice(5).trim();
        if (payload2 === '[DONE]') continue;
        try {
          const json = JSON.parse(payload2);
          const d = json.choices[0].delta || {};
          if (d.reasoning_content) {
            reasoning += d.reasoning_content;
            think.style.display = 'block';
            thinkBody.textContent = reasoning;
          }
          if (d.content) {
            if (!started) { bubble.textContent = ''; started = true; }
            reply += d.content;
            bubble.innerHTML = renderMd(reply);
            scrollBottom(false);
          }
        } catch (e) { /* 忽略心跳包 */ }
      }
    }

    bubble.classList.remove('typing');
    if (!reply) bubble.textContent = '（没有返回内容）';
    if (reply) messages.push({ role: 'assistant', content: reply });

  } catch (err) {
    bubble.classList.remove('typing');
    bubble.classList.add('err');
    // 主动点「停止」不算错误，保留已生成的内容
    if (err.name === 'AbortError') {
      bubble.classList.remove('err');
      if (reply) { bubble.innerHTML = renderMd(reply); messages.push({ role: 'assistant', content: reply }); }
    } else {
      bubble.textContent = '请求失败：' + err.message;
    }
  } finally {
    busy = false;
    controller = null;
    updateBtn();
    scrollBottom(true);
  }
}

function updateBtn() {
  sendBtn.textContent = busy ? '停止' : '发送';
  inputEl.disabled = false;
}

// ============================================================
//  输入区交互
// ============================================================
sendBtn.onclick = () => { busy ? controller.abort() : send(); };
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = '44px';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
});
$('clearBtn').onclick = () => {
  messages = [];
  msgsEl.innerHTML = '';
  welcomeEl.style.display = '';
};
document.querySelectorAll('.example').forEach(b => {
  b.onclick = () => { inputEl.value = b.textContent; send(); };
});
</script>
</body>
</html>
